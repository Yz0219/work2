    <div class="box">
        <h1>钢琴社团活动介绍</h1>
        <p>大学钢琴社面向全校热爱钢琴的同学，无论你是拥有多年演奏功底，还是完全零基础，都欢迎来到这里。社团定期开展钢琴基础教学、合奏排练、校园汇报演出、户外钢琴音乐会。</p>
        <p>我们会组织练习交流、琴房打卡，举办小型演奏会，给大家上台展示自我的机会。在这里可以结交同样热爱音乐的伙伴，感受钢琴旋律带来的治愈与美好。</p>
        <p>社团不设门槛，不需要考级证书，只要你喜欢音乐，就可以加入我们，在大学留下属于自己的音乐回忆。</p>
